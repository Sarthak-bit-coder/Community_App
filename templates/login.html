{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-split">
  <div class="auth-photo" style="background-image:url('{{ url_for('static', filename='img/brownstone-street.webp') }}')">
    <blockquote>Good neighbors keep an eye out for each other.</blockquote>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in with the email you signed up with.</p>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" name="email" placeholder="you@example.com" required autofocus
                 value="{{ request.form.get('email', '') }}">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
      </form>
      <p class="auth-foot">New here? <a class="text-link" href="{{ url_for('signup_page', next=request.args.get('next')) }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
